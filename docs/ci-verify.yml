name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: npm ci
      - run: npm run build && npm run check
      - run: python -m unittest test_api test_cloud_repository test_support test_personalization test_strategy_workshop test_editable_demo test_success_basis test_outcomes test_leadership test_scenarios test_registration test_profiles
